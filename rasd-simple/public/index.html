<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رَصد | التقارير اليومية</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><span class="mark">ر</span><div><h1>رَصد</h1><p>نماذج التقارير اليومية</p></div></div><button id="testTelegram" class="outline">اختبار Telegram</button></header>
<main>
<section class="intro"><div><p class="eyebrow">إدارة الفروع ببساطة</p><h2>اختر نوع التقرير</h2><p>عبّئ النموذج واحفظه، وسيُرسل تلقائيًا إلى Telegram.</p></div></section>
<nav id="tabs" class="tabs">
<button class="active" data-type="sales">المبيعات</button><button data-type="expenses">المصروفات</button><button data-type="waste">التالف والهدر</button><button data-type="maintenance">الصيانة</button><button data-type="staff">الموظفون</button>
</nav>
<section class="panel">
<div class="panel-head"><div><p class="eyebrow">نموذج جديد</p><h2 id="formTitle">تقرير المبيعات</h2></div><span class="pill">حفظ + إرسال</span></div>
<form id="reportForm" enctype="multipart/form-data">
<div class="common"><label>التاريخ<input name="report_date" type="date" required></label><label>اسم الفرع<input name="branch" placeholder="مثال: الفرع الرئيسي"></label></div>
<div id="dynamicFields" class="fields"></div>
<label class="file-label">مرفق اختياري (صورة أو PDF)<input name="attachment" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label>
<button class="submit" type="submit">حفظ التقرير وإرساله <span>←</span></button><p id="formMessage" role="status"></p>
</form>
</section>
<section class="history"><div class="panel-head"><div><p class="eyebrow">الأرشيف</p><h2>آخر التقارير</h2></div><button id="refresh" class="outline">تحديث</button></div><div id="reports" class="reports"></div></section>
</main><footer>رَصد · نظام مبسط لتقارير الفروع</footer><script src="app.js"></script>
</body></html>
